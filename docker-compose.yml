# Paste with Docker Compose.
#
#   echo "PASTE_ADMIN_TOKEN=$(openssl rand -hex 32)" > .env   # optional: enables /admin
#   docker compose up -d
#   open http://localhost:8080          (admin: http://localhost:8080/admin)
#
# Put a TLS reverse proxy in front for public use, then set PASTE_PUBLIC_URL and,
# if the proxy overwrites it, PASTE_TRUSTED_HEADERS=X-Forwarded-For.
services:
  paste:
    image: ghcr.io/behnambagheri/pastebin:${PASTE_IMAGE_TAG:-latest}
    build: .
    container_name: paste
    restart: unless-stopped
    ports:
      - "${PASTE_PORT:-8080}:8080"
    environment:
      # Admin sign-in token, at least 32 characters. Leave empty to disable /admin.
      PASTE_ADMIN_TOKEN: ${PASTE_ADMIN_TOKEN:-}
      # Public origin used in paste links, e.g. https://paste.example.com.
      PASTE_PUBLIC_URL: ${PASTE_PUBLIC_URL:-}
      # On a mirror, the primary site's origin for the canonical link.
      PASTE_CANONICAL_URL: ${PASTE_CANONICAL_URL:-}
      # Proxy headers to trust for the client IP, e.g. X-Forwarded-For. Empty trusts none.
      PASTE_TRUSTED_HEADERS: ${PASTE_TRUSTED_HEADERS:-}
      # Default expiry in seconds (2592000 = 30 days, 0 = never). Admin settings override it.
      PASTE_DEFAULT_TTL: ${PASTE_DEFAULT_TTL:-2592000}
    volumes:
      - paste-data:/var/lib/paste
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s

volumes:
  paste-data:

# To keep the token out of the environment, use a Docker secret instead:
#   services.paste.environment.PASTE_ADMIN_TOKEN_FILE: /run/secrets/paste_admin_token
#   services.paste.secrets: [paste_admin_token]
#   secrets.paste_admin_token.file: ./paste_admin_token.txt
