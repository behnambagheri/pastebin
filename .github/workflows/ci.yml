name: CI
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Let publishing finish; supersede only pull request checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check that the committed stylesheet is up to date
        run: git diff --exit-code ../static/style.css
      - name: Check shell syntax
        run: bash -n ../scripts/smoke-container.sh
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: helm lint ../charts/pastebin --strict
      - name: Validate rendered manifests
        run: |
          helm template paste ../charts/pastebin --set admin.token="$(openssl rand -hex 32)" --set ingress.enabled=true \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -
  container:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: paste:test
          build-args: BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: scripts/smoke-container.sh paste:test
  publish:
    if: github.event_name != 'pull_request'
    needs: [validate, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Publish the Helm chart to GHCR
        run: |
          helm package charts/pastebin --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/pastebin-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/pastebin-*.tgz
