{{- $adminSecret := include "pastebin.adminSecret" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pastebin.fullname" . }}
  labels:
    {{- include "pastebin.labels" . | nindent 4 }}
spec:
  # SQLite allows one writer: exactly one replica, replaced rather than rolled.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pastebin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pastebin.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if and .Values.admin.token (not .Values.admin.existingSecret) }}
        checksum/admin-token: {{ .Values.admin.token | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pastebin
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PASTE_LISTEN
              value: ":8080"
            - name: PASTE_DATA_DIR
              value: /var/lib/paste
            - name: PASTE_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            {{- with .Values.canonicalUrl }}
            - name: PASTE_CANONICAL_URL
              value: {{ . | quote }}
            {{- end }}
            - name: PASTE_TRUSTED_HEADERS
              value: {{ .Values.trustedHeaders | quote }}
            - name: PASTE_DEFAULT_TTL
              value: {{ .Values.defaultTtl | int64 | quote }}
            {{- if $adminSecret }}
            - name: PASTE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret | quote }}
                  key: {{ .Values.admin.secretKey | default "token" | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/paste
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pastebin.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
