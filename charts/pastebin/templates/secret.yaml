{{- if and .Values.admin.token (not .Values.admin.existingSecret) }}
{{- if lt (len .Values.admin.token) 32 }}
{{- fail "admin.token must be at least 32 characters; generate one with: openssl rand -hex 32" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pastebin.adminSecret" . }}
  labels:
    {{- include "pastebin.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.admin.secretKey | default "token" }}: {{ .Values.admin.token | b64enc | quote }}
{{- end }}
