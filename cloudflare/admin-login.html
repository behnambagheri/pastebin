<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin sign-in — Paste</title>
    <link rel="icon" href="/static/favicon.ico" />
    <script>
      (function () {
        var preference = "system";
        try {
          var saved = localStorage.getItem("paste-theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch (e) {}
        var dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "bea-dark" : "bea");
      })();
    </script>
    <link href="__STYLE_URL__" rel="stylesheet" />
  </head>
  <body class="flex min-h-screen items-center justify-center bg-base-200 px-4 text-base-content">
    <main class="card card-border w-full max-w-sm bg-base-100 shadow-sm">
      <form method="post" action="/admin/login" class="card-body gap-4">
        <div class="flex items-center gap-2">
          <svg aria-hidden="true" class="size-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1" /><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2" /><path d="M8 12h8M8 16h5" /></svg>
          <h1 class="text-lg font-semibold">Paste admin</h1>
        </div>
        <p class="text-sm text-base-content/60">Sign in with the admin token configured for this server.</p>
        __ERROR__
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Admin token</span>
          <input name="token" type="password" required autofocus autocomplete="current-password" spellcheck="false" class="input w-full font-mono" />
        </label>
        <button type="submit" class="btn btn-primary">Sign in</button>
        <a href="/new" class="link link-hover text-center text-sm text-base-content/60">Back to Paste</a>
      </form>
    </main>
  </body>
</html>
