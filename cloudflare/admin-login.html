<!doctype html>
<html lang="en" data-product="blue">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin sign-in — Paste</title>
    <link rel="icon" href="/static/favicon.ico" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("bb-theme");
          if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
        } catch (e) {}
      })();
    </script>
    __STYLESHEETS__
  </head>
  <body class="paste-signin">
    <main class="bb-card paste-panel paste-signin-card">
      <form method="post" action="/admin/login" class="paste-dialog-form">
        <div class="paste-brand">
          <a class="bb-brand" href="https://bea.sh" title="bea.sh — Behnam Bagheri">
            <img class="bb-brand-mark" src="__MARK_URL__" width="36" height="36" alt="" />
            <span>bea.sh</span>
          </a>
          <span class="paste-brand-divider" aria-hidden="true">/</span>
          <span class="paste-brand-product">Paste</span>
        </div>
        <h1 class="paste-signin-title">Paste admin</h1>
        <p class="paste-muted">Sign in with the admin token configured for this server.</p>
        __ERROR__
        <label class="paste-field">
          <span class="paste-label">Admin token</span>
          <input name="token" type="password" required autofocus autocomplete="current-password" spellcheck="false" class="paste-input paste-mono" />
        </label>
        <button type="submit" class="bb-button bb-button--primary paste-signin-submit">Sign in</button>
        <a href="/new" class="paste-signin-back">Back to Paste</a>
      </form>
    </main>
  </body>
</html>
